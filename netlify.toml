[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML: no cachear agresivamente — siempre revalidar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets fingerprinted (cuando los haya en /assets/): cachear fuerte
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JSX/CSS bajo /src/ — cache moderado mientras no se hace build con hash
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
